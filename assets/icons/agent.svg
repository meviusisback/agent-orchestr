<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Agent / Orchestrator: simple robot head, high-contrast for 16px bars -->
  <rect x="5" y="7" width="14" height="11" rx="2.5" fill="#A855F7" fill-opacity="0.18" stroke="#A855F7" stroke-width="1.6"/>
  <!-- antennae -->
  <line x1="9.5" y1="7" x2="8" y2="3.5" stroke="#A855F7" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="14.5" y1="7" x2="16" y2="3.5" stroke="#A855F7" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="8" cy="3.3" r="1.1" fill="#A855F7"/>
  <circle cx="16" cy="3.3" r="1.1" fill="#A855F7"/>
  <!-- eyes -->
  <circle cx="9.5" cy="12" r="1.6" fill="#A855F7"/>
  <circle cx="14.5" cy="12" r="1.6" fill="#A855F7"/>
  <!-- mouth grid -->
  <line x1="9.5" y1="15.5" x2="14.5" y2="15.5" stroke="#A855F7" stroke-width="1.3" stroke-linecap="round"/>
</svg>
